<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB49C"/>
      <stop offset="0.55" stop-color="#FFD9C9"/>
      <stop offset="1" stop-color="#A8E0D6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- soft backdrop circle behind the mark -->
  <circle cx="300" cy="315" r="200" fill="#FFF8F1" fill-opacity="0.6"/>
  <!-- mark -->
  <g transform="translate(146 161) scale(1.2)">
    <ellipse cx="54" cy="104" rx="30" ry="58" transform="rotate(20 54 104)" fill="#4FB8A8"/>
    <ellipse cx="202" cy="104" rx="30" ry="58" transform="rotate(-20 202 104)" fill="#4FB8A8"/>
    <circle cx="128" cy="128" r="84" fill="#FF7A59"/>
    <circle cx="72" cy="150" r="10" fill="#FFB49C"/>
    <circle cx="184" cy="150" r="10" fill="#FFB49C"/>
    <circle cx="98" cy="118" r="9" fill="#2E2A27"/>
    <circle cx="158" cy="118" r="9" fill="#2E2A27"/>
    <ellipse cx="128" cy="162" rx="30" ry="22" fill="#FFF8F1"/>
    <ellipse cx="128" cy="152" rx="9" ry="6" fill="#2E2A27"/>
    <circle cx="128" cy="194" r="9" fill="#4FB8A8"/>
  </g>
  <!-- text -->
  <text x="560" y="320" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="150" font-weight="800" fill="#2E2A27">마마독</text>
  <text x="562" y="400" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="38" font-weight="600" fill="#2E2A27">아기랑, 강아지랑, 서울 나들이</text>
  <text x="562" y="470" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="28" font-weight="500" fill="#2E2A27" fill-opacity="0.72">서울 아기+강아지 나들이 지도</text>
</svg>
